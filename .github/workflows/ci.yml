name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-and-public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - run: npm run public-security:smoke

  product-integration:
    needs: quality-and-public-safety
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RECALLANT_DATABASE_URL: postgres://recallant:example-password@127.0.0.1:15433/recallant_agent_work
      RECALLANT_CONTINUITY_DATABASE_URL: postgres://recallant:example-password@127.0.0.1:15433/recallant_continuity_test
      RECALLANT_OLLAMA_URL: http://127.0.0.1:9
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:reset:integration
      - run: npm run build
      - run: npm run integration-embedding-route:smoke
      - run: npm test
      - name: Create disposable continuity test database
        run: docker compose -p recallant-dev exec -T postgres psql -U recallant -d recallant_agent_work -c 'CREATE DATABASE recallant_continuity_test'
      - run: npm run test:continuity
      - run: npm run public-readiness:smoke
      - run: npm run review-ui:playwright
      - name: Stop integration database
        if: always()
        run: npm run db:down
