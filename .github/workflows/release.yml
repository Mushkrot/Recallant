name: Release candidate gates

on:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish the prerelease after all gates pass (tag refs only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deterministic-release-gates:
    uses: ./.github/workflows/ci.yml

  prerelease-rehearsal:
    needs: deterministic-release-gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RECALLANT_DATABASE_URL: postgres://recallant:example-password@127.0.0.1:15433/recallant_agent_work
      RECALLANT_OLLAMA_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:reset:integration
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - run: npm run integration-embedding-route:smoke
      - run: npm run release-identity:smoke
      - name: Verify install from the exact candidate ref
        env:
          RECALLANT_RELEASE_REPO_URL: https://github.com/Mushkrot/Recallant.git
          RECALLANT_RELEASE_REF: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          RECALLANT_EXPECTED_REVISION: ${{ github.sha }}
        run: npm run release-install:smoke
      - run: npm run cli-version:smoke
      - run: npm run cli-update:smoke
      - name: Install promtool for backup alert rule tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes prometheus
          promtool --version
      - run: npm run installer:smoke
      - run: npm run public-clean-host:smoke
      - run: npm run public-install-rollback:smoke
      - run: npm run onboarding:smoke
      - run: npm run security-review:smoke
      - run: npm run remote-connect-external-rehearsal:smoke
      - run: npm run remote-mcp-external-rehearsal:smoke
      - run: npm run remote-live-external-canary:smoke
      - run: npm run public-readiness:smoke
      - run: npm run public-security:smoke
      - name: Stop rehearsal database
        if: always()
        run: npm run db:down

  publish-prerelease:
    if: ${{ inputs.publish_prerelease }}
    needs: prerelease-rehearsal
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate exact annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          expected_tag="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected_tag"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$(git rev-parse HEAD)"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$(git rev-parse HEAD)" \
            --title "Recallant $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --prerelease \
            --latest=false
